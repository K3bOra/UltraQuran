<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أذان</title>
<style>
  @font-face { font-family: "Cairo"; src: url("Cairo-SemiBold.ttf") format("truetype"); font-weight: 600; }
  :root { --gold: #d9b36c; --gold2: #f6dea0; --gold3: #9c7633; --paper: #fbf5e6; --mist: #d3dfd8; --shade: 6, 16, 22; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { font: 600 15px/1.6 "Cairo", "Segoe UI", Tahoma, sans-serif; color: var(--paper); padding: 12px; }

  .card { position: relative; isolation: isolate; height: 100%; overflow: hidden; border-radius: 26px; background: #081a1f;
    box-shadow: 0 26px 60px #000d, 0 0 0 1px #000a; animation: rise .8s cubic-bezier(.18, .9, .22, 1.08) both; }
  @keyframes rise { from { transform: translateY(70px) scale(.95); opacity: 0; filter: blur(8px); } to { transform: none; opacity: 1; filter: none; } }
  .card.out { animation: fall .45s ease-in both; }
  @keyframes fall { to { transform: translateY(40px) scale(.97); opacity: 0; filter: blur(4px); } }

  /* ---- the photograph of the prayer's hour, with a slow cinematic push-in ---- */
  .photo { position: absolute; inset: 0; z-index: -3; background: center/cover no-repeat; transform-origin: 18% 60%;
    animation: push 40s ease-out both; }
  @keyframes push { from { transform: scale(1.02); } to { transform: scale(1.14); } }
  /* the text side (right in Arabic) darkened softly so the words stay readable; the mosque stays bright */
  .veil { position: absolute; inset: 0; z-index: -2;
    background:
      linear-gradient(270deg, rgba(var(--shade), .86) 0%, rgba(var(--shade), .70) 34%, rgba(var(--shade), .18) 62%, rgba(var(--shade), 0) 78%),
      linear-gradient(0deg, rgba(var(--shade), .55) 0%, rgba(var(--shade), 0) 40%); }
  .vignette { position: absolute; inset: 0; z-index: -1; box-shadow: inset 0 0 90px #000a; border-radius: 26px; }

  /* ---- gold frame ---- */
  .frame { position: absolute; inset: 0; border-radius: 26px; pointer-events: none; z-index: 5; border: 1.5px solid transparent;
    background: linear-gradient(135deg, #fff1c4, var(--gold3) 28%, var(--gold) 50%, var(--gold3) 72%, #fff1c4) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .frame.inner { inset: 7px; border-radius: 20px; border-width: 1px; opacity: .35; }
  .shine { position: absolute; inset: 0; z-index: 6; pointer-events: none; border-radius: 26px; overflow: hidden; }
  .shine::after { content: ""; position: absolute; top: -50%; width: 30%; height: 200%; left: -50%; transform: rotate(18deg);
    background: linear-gradient(90deg, transparent, #fff3d014 45%, #fff6dd30 50%, #fff3d014 55%, transparent); animation: sweep 7s ease-in-out 1s infinite; }
  @keyframes sweep { 0% { left: -50%; } 30%, 100% { left: 130%; } }

  /* ---- content, on the sky side ---- */
  .content { position: absolute; top: 0; bottom: 0; right: 0; width: 60%; padding: 26px 32px 22px 18px; display: flex; flex-direction: column; }
  .kicker { display: flex; align-items: center; gap: 9px; color: var(--gold2); font-size: 13px; letter-spacing: .4px; text-shadow: 0 1px 6px #000; }
  .kicker .dot { width: 8px; height: 8px; border-radius: 50%; background: #74f0bd; box-shadow: 0 0 0 3px #74f0bd30, 0 0 12px #74f0bd; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .done .kicker .dot { background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: none; }
  .eq { display: inline-flex; gap: 3px; align-items: flex-end; height: 13px; }
  .eq span { width: 3px; border-radius: 2px; background: var(--gold2); animation: eq 1s ease-in-out infinite; }
  .eq span:nth-child(2) { animation-delay: .25s; } .eq span:nth-child(3) { animation-delay: .5s; } .eq span:nth-child(4) { animation-delay: .12s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 13px; } }
  .paused .eq span { animation: none; height: 3px; }

  h1 { margin-top: 6px; font: 700 50px/1.15 "Cairo", sans-serif; letter-spacing: -.5px;
    background: linear-gradient(180deg, #fffdf4 0%, #fbe7b4 40%, var(--gold) 82%, #b88d45 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 14px #000c); }
  .sub { font-size: 15px; color: var(--mist); text-shadow: 0 1px 8px #000; }
  .rule { height: 1px; margin: 12px 0 10px; width: 78%; background: linear-gradient(270deg, var(--gold), #d9b36c55 60%, transparent); }
  .row { display: flex; align-items: center; gap: 12px; }
  .clock { font: 700 28px/1 "Cairo", sans-serif; color: #fff; text-shadow: 0 2px 10px #000; }
  .clock small { font-size: 14px; color: var(--gold2); margin-inline-start: 5px; }
  .city { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 13px; color: var(--paper);
    background: #ffffff18; border: 1px solid #ffffff22; backdrop-filter: blur(8px); }
  .city:empty { display: none; }
  .city svg { width: 14px; height: 14px; color: var(--gold2); }

  .voice { display: flex; align-items: center; gap: 10px; margin-top: 12px; min-height: 40px; opacity: 0; transition: opacity .6s; }
  .voice.on { opacity: 1; }
  .voice .av { flex: none; width: 40px; height: 40px; border-radius: 50%; padding: 2px; background: conic-gradient(from 200deg, #fff1c4, var(--gold), var(--gold3), #fff1c4); }
  .voice .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .voice small { display: block; font-size: 11.5px; color: var(--mist); line-height: 1.3; }
  .voice b { font-size: 14.5px; color: var(--paper); line-height: 1.3; }

  .bar { margin-top: auto; height: 3px; border-radius: 3px; background: #ffffff26; position: relative; }
  .bar i { position: absolute; top: 0; bottom: 0; right: 0; width: 0; border-radius: 3px; background: linear-gradient(270deg, var(--gold3), var(--gold2)); transition: width .5s linear; }
  .bar i::after { content: ""; position: absolute; left: -4px; top: 50%; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-50%); background: #fff7e2; box-shadow: 0 0 12px 3px #f6dea0aa; }

  .dua { display: none; margin-top: auto; padding: 9px 14px; border-radius: 14px; text-align: center; font: 600 13.5px/1.85 "Cairo", sans-serif; color: var(--paper);
    background: rgba(var(--shade), .55); border: 1px solid #d9b36c55; backdrop-filter: blur(10px); }
  .dua small { display: block; font-size: 11.5px; color: var(--gold2); }
  .done .dua { display: block; animation: rise .6s ease both; }
  .done .bar, .done .voice, .done .sub, .done .rule { display: none; }
  .done h1 { font-size: 40px; }
  .done .content { width: 66%; }
  .done .dua { font-size: 13px; line-height: 1.75; padding: 7px 12px; }
  .done .row { margin-top: 4px; }

  .btns { display: flex; gap: 10px; margin-top: 14px; }
  button { font: 600 14.5px "Cairo", sans-serif; border: 0; cursor: pointer; height: 42px; border-radius: 999px; padding: 0 18px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, filter .15s; }
  button:hover { filter: brightness(1.08); } button:active { transform: scale(.97); }
  .primary { flex: 1; color: #1b140a; background: linear-gradient(180deg, #fff2c8, var(--gold2) 35%, var(--gold) 100%); box-shadow: 0 8px 20px #0008, inset 0 1px 0 #ffffffbb, inset 0 -2px 0 #9c763366; }
  .ghost { color: var(--paper); background: #ffffff16; border: 1px solid #ffffff30; backdrop-filter: blur(10px); }
  .x { position: absolute; top: 18px; left: 20px; z-index: 7; width: 30px; height: 30px; padding: 0; color: #fff; background: #0006; border: 1px solid #ffffff26; backdrop-filter: blur(6px); }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="card paused" id="card">
  <div class="photo" id="photo"></div><div class="veil"></div><div class="vignette"></div>
  <div class="frame"></div><div class="frame inner"></div><div class="shine"></div>
  <button class="x" id="close" aria-label="إغلاق"><svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>

  <div class="content">
    <div class="kicker"><span class="dot"></span><span id="kick">حان الآن موعد الأذان</span><span class="eq"><span></span><span></span><span></span><span></span></span></div>
    <h1 id="title">أذان الصلاة</h1>
    <div class="sub" id="sub"></div>
    <div class="rule"></div>
    <div class="row"><span class="clock" id="clock"></span><span class="city" id="city"></span></div>
    <div class="voice" id="voice"><span class="av" id="av" hidden></span><span><small>بصوت فضيلة الشيخ</small><b id="vname"></b></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="dua"><small>✦ دعاء بعد الأذان ✦</small>اللهم رب هذه الدعوة التامة والصلاة القائمة، آتِ محمداً الوسيلة والفضيلة، وابعثه مقاماً محموداً الذي وعدته</div>
    <div class="btns">
      <button class="primary" id="stop"><svg class="i" viewBox="0 0 24 24" id="stopI"><rect x="7" y="7" width="10" height="10" rx="2"/></svg><span id="stopT">إيقاف الأذان</span></button>
      <button class="ghost" id="open"><svg class="i" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5v13"/></svg>افتح ألترا قرآن</button>
    </div>
  </div>
</div>
<audio id="a" preload="auto"></audio>
<script>
(() => {
  const C = window.__CARD || {};
  const T = window.__TAURI_INTERNALS__;
  const call = (cmd, args) => { try { return T.invoke(cmd, args || {}); } catch (e) { return Promise.resolve(); } };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s || "").replace(/[<>&"]/g, "");
  const card = $("card"), a = $("a");

  // ---- the prayer: its photograph and words
  const P = {
    fajr:    { n: "الفجر",  sub: "الصلاة خير من النوم",               shade: "8, 14, 34" },
    dhuhr:   { n: "الظهر",  sub: "حيّ على الصلاة · حيّ على الفلاح",    shade: "8, 30, 52" },
    asr:     { n: "العصر",  sub: "حافظوا على الصلوات والصلاة الوسطى", shade: "40, 22, 6" },
    maghrib: { n: "المغرب", sub: "حيّ على الصلاة · حيّ على الفلاح",    shade: "30, 8, 18" },
    isha:    { n: "العشاء", sub: "حيّ على الصلاة · حيّ على الفلاح",    shade: "4, 8, 26" },
  };
  // a test shows the photograph of the current hour
  const hour = new Date().getHours();
  const auto = hour < 6 ? "fajr" : hour < 14 ? "dhuhr" : hour < 17 ? "asr" : hour < 19 ? "maghrib" : "isha";
  const key = P[C.k] ? C.k : auto;
  const p = P[key];
  $("photo").style.backgroundImage = `url("${key}.jpg")`;
  document.documentElement.style.setProperty("--shade", p.shade);

  $("title").textContent = C.test ? "تجربة الأذان" : P[C.k] ? `أذان ${p.n}` : C.name ? `أذان ${String(C.name).replace(/^صلاة\s+/, "")}` : "أذان الصلاة";
  $("kick").textContent = C.test ? "كده الأذان هيشتغل في ميعاده" : "حان الآن موعد الأذان";
  $("sub").textContent = C.test ? "البرنامج هيأذّن في كل صلاة حتى وهو جنب الساعة" : p.sub;
  const at = C.at ? new Date(C.at) : new Date();
  const parts = new Intl.DateTimeFormat("ar-EG", { hour: "numeric", minute: "2-digit" }).formatToParts(at);
  const ap = parts.find((x) => x.type === "dayPeriod");
  $("clock").innerHTML = `${esc(parts.filter((x) => x.type !== "dayPeriod").map((x) => x.value).join("").trim())}${ap ? `<small>${esc(ap.value)}</small>` : ""}`;
  if (C.city) $("city").innerHTML = `<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>${esc(C.city)}`;

  // ---- closing: the voice fades out instead of being cut
  let closing = false;
  const close = () => {
    if (closing) return; closing = true;
    const v0 = a.volume, t0 = performance.now();
    const fade = () => { const k = Math.min(1, (performance.now() - t0) / 400); a.volume = v0 * (1 - k); if (k < 1) requestAnimationFrame(fade); else a.pause(); };
    fade();
    card.classList.add("out");
    setTimeout(() => call("stop_adhan"), 450);
  };
  $("close").onclick = close;
  $("stop").onclick = close;
  $("open").onclick = () => { call("open_main"); close(); };
  addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

  // ---- the muezzin: name and photo from the site (when online), the voice from the copy on the computer
  fetch((C.site || "") + "data/adhan.json").then((r) => r.json()).then((list) => {
    const row = list.find((x) => x[3] === C.url);
    if (!row) return;
    $("vname").textContent = row[1];
    $("voice").classList.add("on");
    return fetch((C.site || "") + "data/meta.json").then((r) => r.json()).then((m) => {
      if (!(m.portraits || []).includes(row[0])) return;
      const img = new Image();
      img.onload = () => { const av = $("av"); av.appendChild(img); av.hidden = false; };
      img.src = `${C.site}img/p/${row[0]}.webp`;
    });
  }).catch(() => {});

  // ---- the adhan
  const sources = [];
  if (C.file && T && T.convertFileSrc) sources.push(T.convertFileSrc(C.file));
  if (C.url) sources.push(C.url);
  let si = 0;
  const next = () => {
    if (si >= sources.length) return finish();
    a.src = sources[si++];
    a.play().catch(() => next());
  };
  a.onerror = next;
  a.ontimeupdate = () => { if (a.duration) $("prog").style.width = `${(a.currentTime / a.duration) * 100}%`; };
  a.onplay = () => card.classList.remove("paused");
  a.onpause = () => card.classList.add("paused");
  function finish() {
    if (card.classList.contains("done")) return;
    card.classList.add("done", "paused");
    $("kick").textContent = "تقبّل الله منا ومنكم";
    $("stopT").textContent = "تم";
    $("stopI").innerHTML = '<path d="m5 12.5 4.5 4.5L19 7.5"/>';
    setTimeout(close, 60000);
  }
  a.onended = finish;
  sources.length ? next() : finish();
  if (C.test) setTimeout(() => { if (!a.paused) { a.pause(); finish(); } }, 15000);
})();
</script>
</body>
</html>
