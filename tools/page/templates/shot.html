<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="size" content="1600x940">
<link rel="stylesheet" href="../base.css"><script src="../ornament.js"></script>
<style>:root{--w:1600px;--h:940px}
.mat{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#0f3a2e,#05150f 75%)}
.scr{position:absolute;left:70px;top:58px;width:1460px;height:821px;overflow:hidden;border-radius:4px;box-shadow:0 0 0 2px #c99a43,0 0 0 8px #071d17,0 0 0 9px rgba(214,178,94,.5),0 30px 60px rgba(0,0,0,.6)}
.scr img{width:100%;height:100%;object-fit:cover;display:block}
.pend{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:url(../stars.jpg) center/cover}
.pend .a{font:600 58px/1.4 Cairo}.pend .e{font:600 26px/1.4 Cairo;color:var(--sage);direction:ltr}.pend .s{font:600 26px/1.4 Cairo;color:var(--ivory);margin-top:22px}
</style></head><body><div class="mat"></div><div class="scr" id="scr"></div><div id="art"></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('scr').innerHTML=q.get('src')?`<img src="${q.get('src')}">`:
 `<div class="pend"><div class="a gilt ar">${q.get('ar')||''}</div><div class="e">${q.get('en')||''}</div><div class="s ar">الصورة الحقيقية من البلجن قريبًا</div></div>`;
const r=(x,y)=>O.rosette(x,y,14);
document.getElementById('art').innerHTML=O.svg(r(62,50)+r(1538,50)+r(62,887)+r(1538,887));
</script></body></html>
