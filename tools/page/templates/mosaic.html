<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="size" content="1600x900">
<link rel="stylesheet" href="../base.css"><script src="../ornament.js"></script>
<style>:root{--w:1600px;--h:900px}
.stars{opacity:.35}
.grid{position:absolute;left:78px;right:78px;top:78px;bottom:78px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:20px;direction:rtl}
.tile{position:relative;border-radius:16px;background:linear-gradient(180deg,rgba(23,80,63,.78),rgba(9,38,30,.86));
  box-shadow:inset 0 0 0 1px rgba(214,178,94,.55),inset 0 0 0 5px rgba(9,38,30,.9),inset 0 0 0 6px rgba(214,178,94,.22),0 10px 24px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 14px}
.tile img{width:84px;height:84px;filter:drop-shadow(0 0 14px rgba(214,178,94,.25))}
.n{font:700 31px/1.25 Amiri;margin-top:6px}
.m{font:400 16px/1.4 Cairo;color:var(--ivory);opacity:.86;margin-top:2px}
.e{font:600 13px/1.3 Cairo;color:var(--sage);margin-top:3px;direction:ltr;letter-spacing:.3px}
</style></head><body>
<div class="stars"></div><div class="vignette" style="opacity:.6"></div><div id="art"></div><div class="grid" id="grid"></div>
<script>
const T=[["quran","القرآن الكريم","260 قارئ وتلاوات ومصحف","The Holy Quran"],
["shaarawy","الشيخ الشعراوي","2776 مادة صوتيات وفيديو","Sheikh Al-Sha'rawi"],
["tafsir","التفسير وعلومه","الطبري وابن كثير و1155 درسًا","Tafsir"],
["hadith","الحديث الشريف","شروح صوتية كاملة · 681 مادة","Hadith"],
["sunnah","السنة والشمائل","الشمائل والطب النبوي","Sunnah & Shama'il"],
["seerah","السيرة النبوية","العوضي والرحيق · 167 حلقة","The Prophet's Seerah"],
["prophets","قصص الأنبياء","العوضي والشعراوي · 108 حلقة","Stories of the Prophets"],
["aqeedah","العقيدة والفقه","التوحيد وفقه العبادات","Aqeedah & Fiqh"],
["adhkar","الأذكار والرقية","حصن المسلم والرقية والمسبحة","Adhkar & Ruqyah"],
["asma","أسماء الله الحسنى","الأسماء الـ 99 ومعانيها","The 99 Names"],
["radio","إذاعات القرآن","173 إذاعة قرآنية وإسلامية","Quran Radios"],
["library","المكتبة الإسلامية","زاد المعاد والمتون","Islamic Library"],
["kids","عالم الأطفال","المصحف المعلم وجزء عمّ","Children"],
["calendar","التقويم الإسلامي","التاريخ الهجري والمواسم","Islamic Calendar"],
["quiz","المسابقات","70 سؤالًا بالنتيجة","Quiz"]];
document.getElementById('grid').innerHTML=T.map(([i,n,m,e])=>`<div class="tile"><img src="../icons/${i}.png"><div class="n gilt">${n}</div><div class="m">${m}</div><div class="e">${e}</div></div>`).join('');
document.getElementById('art').innerHTML=O.svg(O.frame(1600,900,18,12,22));
</script></body></html>
