name: Build Android app

on:
  workflow_dispatch:
  push:
    paths: ["android/**"]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Restore signing key
        env:
          KS: ${{ secrets.UQ_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Add the UQ_KEYSTORE_B64 and UQ_KEYSTORE_PASSWORD repository secrets first (see android/README.md)."; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          UQ_KEYSTORE: ${{ runner.temp }}/release.jks
          UQ_KEYSTORE_PASSWORD: ${{ secrets.UQ_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: UltraQuran-apk
          path: android/app/build/outputs/apk/release/app-release.apk
