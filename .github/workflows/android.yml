name: Build Android app

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Restore signing key
        env:
          KS: ${{ secrets.UQ_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Add the UQ_KEYSTORE_B64 and UQ_KEYSTORE_PASSWORD repository secrets first (see android/README.md)."; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          UQ_KEYSTORE: ${{ runner.temp }}/release.jks
          UQ_KEYSTORE_PASSWORD: ${{ secrets.UQ_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: UltraQuran-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish the APK on the website (same download link every time)
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk docs/app/UltraQuran.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app/UltraQuran.apk
          if git diff --cached --quiet; then echo "APK unchanged"; exit 0; fi
          git commit -m "Publish Android APK built by ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
          git push
